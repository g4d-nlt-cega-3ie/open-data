name: Triage new submissions

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map(l => l.name)
            let msg = "Thanks — a maintainer will review this shortly."
            if (labels.includes('submission'))
              msg = "Thanks for submitting a resource to Geo4Dev! A maintainer will review it for completeness, attribution, and fit, then add it to the library. Follow progress via the `status:` labels."
            else if (labels.includes('contact'))
              msg = "Thanks for reaching out — a maintainer will follow up with you."
            else if (labels.includes('alert'))
              msg = "You're on the list! We'll alert you about new datasets, publications, and releases."
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            })
