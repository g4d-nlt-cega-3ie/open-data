name: Dataset / publication submission
description: Suggest a dataset, publication, or training resource for the Geo4Dev library
title: "[Submission] <resource title>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to Geo4Dev! Fill in what you can — a maintainer will review and add it.
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the resource
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link (stable URL)
      description: A public, durable link to the resource
    validations:
      required: true
  - type: dropdown
    id: content_type
    attributes:
      label: Content type
      options:
        - Publication
        - Dataset
        - Training Material
        - Book
        - Document
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A 1–3 sentence summary
  - type: input
    id: authors
    attributes:
      label: Author(s) / organization
  - type: input
    id: location
    attributes:
      label: Country / region (and coordinates if known)
      description: e.g. "Ethiopia · 9.03, 38.74"
  - type: input
    id: category
    attributes:
      label: Category / topic
  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
  - type: input
    id: license
    attributes:
      label: License of the resource
  - type: checkboxes
    id: rights
    attributes:
      label: Confirmation
      options:
        - label: I have the right to share this resource and link, and attribution is preserved.
          required: true
